# Ablation stage 3: IFNet + distillation + refinement (the full RIFE model).
name: ablation_3_refine
data_root: data/vimeo_triplet
out_dir: runs
distill: true
refine: true
batch_size: 16
accum_steps: 1
total_steps: 50000
warmup_steps: 2000
lr_max: 3.0e-4
lr_min: 3.0e-5
weight_decay: 1.0e-4
distill_weight: 0.01
crop: 256
num_workers: 6
pin_memory: true
amp: true
val_every: 2000
val_subset: 500
ckpt_every: 1000
log_every: 50
seed: 0
