# local.yaml for a Kaggle notebook. Set data_root to the mount path of the attached
# Vimeo-90K dataset as shown in the notebook's "Input" sidebar.
name: final
data_root: /kaggle/input/vimeo-triplet/vimeo_triplet
out_dir: /kaggle/working/runs
distill: true
refine: true
batch_size: 16
accum_steps: 1
total_steps: 200000
warmup_steps: 2000
lr_max: 3.0e-4
lr_min: 3.0e-5
weight_decay: 1.0e-4
distill_weight: 0.01
crop: 256
num_workers: 4
pin_memory: true
amp: true
val_every: 2000
val_subset: 500
ckpt_every: 1000
log_every: 50
seed: 0
